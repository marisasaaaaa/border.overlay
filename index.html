<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Neon Conic Border - Glassmorphism</title>
  <!-- Tailwind CSS for Layout & Control Panel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19; /* Deep Space / Dark Slate backdrop */
    }

    /* Custom CSS Variables driven by JavaScript Controls */
    :root {
      --speed: 4s;
      --border-width: 3px;
      --glow-intensity: 0.8;
      --blur-amount: 25px;
    }

    /* Conic Gradient Property Definition for Smooth Keyframe Animation */
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    /* Outer Wrapper for Card Container */
    .neon-card-wrapper {
      position: relative;
      border-radius: 1rem; /* rounded-2xl equivalent */
      padding: var(--border-width);
      display: flex;
      justify-content: center;
      align-items: center;
      isolation: isolate;
    }

    /* Rotating Conic Gradient Layer */
    .neon-card-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: var(--border-width);
      background: conic-gradient(
        from var(--angle),
        transparent 0%,
        #a855f7 25%, /* Neon Purple */
        #ec4899 50%, /* Magenta Pink */
        #818cf8 75%, /* Indigo */
        transparent 100%
      );
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotate-border var(--speed) linear infinite;
      z-index: 2;
    }

    /* Soft Outer Neon Glow Layer */
    .neon-card-wrapper::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--angle),
        transparent 0%,
        #a855f7 25%,
        #ec4899 50%,
        #818cf8 75%,
        transparent 100%
      );
      filter: blur(var(--blur-amount));
      opacity: var(--glow-intensity);
      animation: rotate-border var(--speed) linear infinite;
      z-index: 1;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    /* Glassmorphism Inner Box Content (Kosong tanpa teks) */
    .glass-content {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 280px;
      border-radius: calc(1rem - var(--border-width));
      background: rgba(15, 23, 42, 0.65); /* Dark Glass Fill */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 3;
      overflow: hidden;
    }

    /* Subtle background accent grid inside glass card */
    .glass-grid-pattern {
      background-image: radial-gradient(rgba(168, 85, 247, 0.15) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* Keyframe Rotation */
    @keyframes rotate-border {
      0% {
        --angle: 0deg;
      }
      100% {
        --angle: 360deg;
      }
    }

    /* Custom Styling for Range Sliders */
    input[type=range] {
      accent-color: #ec4899;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between items-center p-4 md:p-8 relative overflow-x-hidden">

  <!-- Ambient Background Orbs for Depth -->
  <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-purple-900/20 rounded-full filter blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-pink-900/20 rounded-full filter blur-[120px] pointer-events-none"></div>

  <!-- Header -->
  <header class="text-center my-4 z-10">
    <h1 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400">
      Neon Glassmorphism Border
    </h1>
    <p class="text-xs md:text-sm text-slate-400 mt-1">
      Running Conic Gradient Animation & Soft Outer Glow
    </p>
  </header>

  <!-- Main Showcase Container -->
  <main class="w-full max-w-md my-auto flex justify-center items-center z-10">
    <!-- Component: Animated Neon Border Card (No Text Inside) -->
    <div class="neon-card-wrapper w-full aspect-[4/3] rounded-2xl shadow-2xl transition-all duration-300">
      <div class="glass-content glass-grid-pattern flex flex-col items-center justify-center p-6 relative">
        <!-- Abstract Glass Element / Icon Badge for Visual Polish -->
        <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center backdrop-blur-md shadow-inner">
          <i data-lucide="sparkles" class="w-6 h-6 text-pink-400 animate-pulse"></i>
        </div>
      </div>
    </div>
  </main>

  <!-- Interactive Control Panel -->
  <footer class="w-full max-w-md mt-6 z-10">
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <span class="text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="sliders" class="w-4 h-4 text-purple-400"></i> Kontrol Animasi
        </span>
        <button id="btn-reset" class="text-xs text-slate-400 hover:text-pink-400 transition-colors flex items-center gap-1">
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset
        </button>
      </div>

      <!-- Controls Grid -->
      <div class="space-y-3">
        <!-- Speed Control -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-slate-300">
            <span>Kecepatan Putaran</span>
            <span id="speed-val" class="text-purple-400 font-mono">4.0s</span>
          </div>
          <input type="range" id="input-speed" min="1" max="10" step="0.5" value="4" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- Border Thickness Control -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-slate-300">
            <span>Ketebalan Border</span>
            <span id="border-val" class="text-pink-400 font-mono">3px</span>
          </div>
          <input type="range" id="input-border" min="1" max="8" step="1" value="3" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <!-- Glow Intensity Control -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-slate-300">
            <span>Intensitas Glow</span>
            <span id="glow-val" class="text-indigo-400 font-mono">80%</span>
          </div>
          <input type="range" id="input-glow" min="0" max="1" step="0.05" value="0.8" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>
      </div>
    </div>
  </footer>

  <!-- Interactivity Script -->
  <script>
    // Initialize Icons
    lucide.createIcons();

    // DOM Elements
    const root = document.documentElement;
    const inputSpeed = document.getElementById('input-speed');
    const inputBorder = document.getElementById('input-border');
    const inputGlow = document.getElementById('input-glow');
    
    const speedVal = document.getElementById('speed-val');
    const borderVal = document.getElementById('border-val');
    const glowVal = document.getElementById('glow-val');
    const btnReset = document.getElementById('btn-reset');

    // Update Speed
    inputSpeed.addEventListener('input', (e) => {
      const val = e.target.value;
      root.style.setProperty('--speed', `${val}s`);
      speedVal.textContent = `${parseFloat(val).toFixed(1)}s`;
    });

    // Update Border Width
    inputBorder.addEventListener('input', (e) => {
      const val = e.target.value;
      root.style.setProperty('--border-width', `${val}px`);
      borderVal.textContent = `${val}px`;
    });

    // Update Glow Intensity
    inputGlow.addEventListener('input', (e) => {
      const val = e.target.value;
      root.style.setProperty('--glow-intensity', val);
      glowVal.textContent = `${Math.round(val * 100)}%`;
    });

    // Reset Values
    btnReset.addEventListener('click', () => {
      inputSpeed.value = 4;
      inputBorder.value = 3;
      inputGlow.value = 0.8;

      root.style.setProperty('--speed', '4s');
      root.style.setProperty('--border-width', '3px');
      root.style.setProperty('--glow-intensity', '0.8');

      speedVal.textContent = '4.0s';
      borderVal.textContent = '3px';
      glowVal.textContent = '80%';
    });
  </script>
</body>
</html>
